# PR과 develop·main에 올라온 코드를 검사한다: lint, 타입 검사, 단위 테스트, 빌드.
# 배포(deploy.yml)와 따로 돌고 서버나 시크릿을 건드리지 않는다.
# E2E(Playwright)는 오래 걸려서 e2e.yml이 따로 돈다: main으로 가는 PR(release·hotfix)과 `e2e` 꼬리표를 단 PR.
name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: lint
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 테스트
        run: npm test

      - name: 빌드
        run: npm run build
