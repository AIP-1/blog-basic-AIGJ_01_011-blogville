# main에 올라온 버전(package.json)의 릴리스 노트(docs/releases/v<버전>.md)로 GitHub 릴리스와 v<버전> 태그를 만든다.
# 이미 그 버전의 릴리스가 있거나 노트 파일이 없으면 아무것도 하지 않는다. 그림은 태그 시점의 저장소 파일을 가리킨다.
name: release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - docs/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 릴리스 만들기
        run: |
          V=$(node -p "require('./package.json').version")
          NOTE="docs/releases/v$V.md"
          if [ ! -f "$NOTE" ]; then echo "$NOTE 이 없어 건너뜀"; exit 0; fi
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V 릴리스가 이미 있음"; exit 0; fi
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v$V/docs/releases/"
          BLOB="https://github.com/${GITHUB_REPOSITORY}/blob/v$V/"
          # 첫 줄(제목)은 릴리스 이름으로 쓰고, 상대 경로 그림·링크를 절대 주소로 바꾼다
          tail -n +2 "$NOTE" \
            | sed -e "s#](img/#](${RAW}img/#g" \
                  -e "s#](\.\./\.\./#](${BLOB}#g" \
                  -e "s#](\.\./#](${BLOB}docs/#g" > /tmp/notes.md
          TITLE=$(head -n 1 "$NOTE" | sed 's/^# *//')
          gh release create "v$V" --target "$GITHUB_SHA" --title "$TITLE" --notes-file /tmp/notes.md
