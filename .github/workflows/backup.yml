# DB 백업 (매일 새벽 3시 KST 자동, Actions → backup → Run workflow로 바로). 서버 ~/blogville/backups/에 최근 14개.
name: backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 주소 정리
        env:
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          h=$(printf '%s' "$SSH_ADDRESS" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*##; s#.*@##; s#:[0-9]+$##')
          echo "::add-mask::$h"
          p=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          { echo "SSH_HOST=$h"; echo "SSH_PORT=${p:-22}"; } >> "$GITHUB_ENV"

      - name: DB 백업
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script: bash ~/blogville/backup.sh
