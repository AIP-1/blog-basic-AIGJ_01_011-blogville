# main에 올라오면 도커 이미지를 만들어 서버에 올리고 deploy/run.sh로 실행한다 (포트 8400).
# 서버에서는 docker compose(deploy/compose.yml)로 nginx(8400) + 앱 두 벌(blue 8401 / green 8402)을 띄워 무중단으로 바꾼다.
# 쓰는 시크릿: SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD,
#             DB_ADDRESS, DB_PORT, DB_NAME, DB_SCHEMA, DB_USERNAME, DB_PASSWORD
#             APP_URL (선택, 없으면 http://SSH_ADDRESS:8400)
#             ADMIN_USERNAME, ADMIN_PASSWORD (선택, 있으면 관리자 계정·공지 블로그를 만들거나 비밀번호 갱신)
#             KAKAO_/NAVER_/GOOGLE_CLIENT_ID·_CLIENT_SECRET (선택, 둘 다 있는 서비스만 소셜 로그인 버튼이 켜짐)
#             FEEDBACK_BOT_TOKEN (선택, 32자 이상이면 버그·문의 자동 처리 API /api/feedback가 켜짐)
#             NAVER_SEARCH_CLIENT_ID·_SECRET (선택, 있으면 📰 뉴스 위젯이 켜짐 — NAVER API HUB 뉴스 검색 앱의 인증 정보)
#             NAVER_TREND_CLIENT_ID·_SECRET (선택, 검색어 트렌드를 다른 API HUB 앱으로 받았을 때만. 없으면 위 NAVER_SEARCH_* 앱으로 🔎 키워드 도우미)
#             KAKAO_REST_API_KEY (선택, 있으면 🍽 맛집 내 주변·식당 찾기 — 카카오맵 사용 설정을 켠 앱의 REST API 키)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 이미지 저장소(GHCR)에 올리기
    steps:
      - uses: actions/checkout@v4

      - name: 도커 이미지 만들기
        run: |
          IMAGE="bv8400-blogville:${GITHUB_SHA::7}"  # 서버 도커를 같이 쓰므로 이름이 겹치지 않게
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .
          # 앞단 nginx 이미지도 함께 보낸다 (서버가 Docker Hub에서 받지 못해도 뜨게)
          NGINX_IMAGE=$(sed -n 's/^NGINX_IMAGE=//p' deploy/deploy.env)
          docker pull -q "$NGINX_IMAGE"
          mkdir -p out/bin
          docker save "$IMAGE" "$NGINX_IMAGE" | gzip > out/blogville-image.tar.gz
          cp -r deploy/run.sh deploy/rollback.sh deploy/backup.sh deploy/common.sh deploy/compose.yml deploy/deploy.env deploy/nginx out/
          # 서버에 docker compose가 없을 때 쓸 compose (러너와 서버 모두 x86_64)
          gzip -c "$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')" > out/bin/docker-compose.gz
          ls -lhR out

      - name: DB 접속 주소 만들기
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python3 - <<'EOF'
          import os, re
          from urllib.parse import quote
          e = os.environ

          # 시크릿에 들어가기 쉬운 군더더기(앞뒤 공백·줄바꿈, http://, 아이디@, :포트, 끝의 /)를 걷어 낸다
          def host(raw):
              h = raw.strip()
              h = re.sub(r"^[a-zA-Z]+://", "", h)
              h = h.split("/")[0]
              h = h.rsplit("@", 1)[-1]
              if h.count(":") == 1:
                  h = h.split(":")[0]
              return h

          ssh_raw, db_raw = e["SSH_ADDRESS"], e["DB_ADDRESS"]
          ssh, db = host(ssh_raw), host(db_raw)
          # 값은 보이지 않고 모양만 알린다
          for name, raw, clean in (("SSH_ADDRESS", ssh_raw, ssh), ("DB_ADDRESS", db_raw, db)):
              kind = "IP" if re.fullmatch(r"[0-9.]+", clean) else "도메인"
              print(f"{name}: {kind}, 정리 {'함' if raw != clean else '안 함'}, 길이 {len(clean)}")

          user = quote(e["DB_USERNAME"].strip(), safe="")
          pw = e.get("DB_PASSWORD", "")
          auth = f"{user}:{quote(pw, safe='')}" if pw else user
          url = f"postgres://{auth}@{db}:{e.get('DB_PORT', '').strip() or '5432'}/{quote(e['DB_NAME'].strip(), safe='')}"
          if e.get("DB_SCHEMA", "").strip():
              url += f"?search_path={quote(e['DB_SCHEMA'].strip(), safe='')}"
          app_url = e.get("APP_URL", "").strip() or f"http://{ssh}:8400"

          for v in (ssh, url):
              print(f"::add-mask::{v}")
          with open(e["GITHUB_ENV"], "a") as f:
              f.write(f"SSH_HOST={ssh}\nSSH_PORT={e.get('SSH_PORT', '').strip() or '22'}\nDATABASE_URL={url}\nAPP_URL={app_url}\n")
          EOF

      - name: 서버 접속 확인
        run: |
          if ! getent hosts "$SSH_HOST" >/dev/null && ! [[ "$SSH_HOST" =~ ^[0-9.]+$ ]]; then
            echo "::error::SSH_ADDRESS 주소를 찾을 수 없어요. 공인 IP나 인터넷에서 찾을 수 있는 도메인을 넣어 주세요 (사설 IP·내부 이름은 GitHub에서 닿지 않아요)."
            exit 1
          fi
          if ! timeout 15 bash -c "</dev/tcp/$SSH_HOST/$SSH_PORT" 2>/dev/null; then
            echo "::error::SSH_ADDRESS:SSH_PORT로 접속할 수 없어요. 서버가 켜져 있는지, 방화벽에서 GitHub Actions의 접속을 막지 않는지 확인해 주세요."
            exit 1
          fi
          echo "서버 SSH 포트에 닿아요"

      - name: 서버로 이미지 올리기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: out/blogville-image.tar.gz,out/run.sh,out/rollback.sh,out/backup.sh,out/common.sh,out/compose.yml,out/deploy.env,out/nginx,out/bin
          target: blogville
          strip_components: 1

      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          APP_URL: ${{ env.APP_URL }}
          IMAGE: ${{ env.IMAGE }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
          NAVER_TREND_CLIENT_ID: ${{ secrets.NAVER_TREND_CLIENT_ID }}
          NAVER_TREND_CLIENT_SECRET: ${{ secrets.NAVER_TREND_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          FEEDBACK_BOT_TOKEN: ${{ secrets.FEEDBACK_BOT_TOKEN }}
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DATABASE_URL,APP_URL,IMAGE,ADMIN_USERNAME,ADMIN_PASSWORD,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NAVER_SEARCH_CLIENT_ID,NAVER_SEARCH_CLIENT_SECRET,NAVER_TREND_CLIENT_ID,NAVER_TREND_CLIENT_SECRET,KAKAO_REST_API_KEY,FEEDBACK_BOT_TOKEN
          command_timeout: 10m
          script: bash ~/blogville/run.sh

      # 배포가 끝난 뒤, 같은 이미지를 GitHub 이미지 저장소(GHCR)에도 버전 꼬리표를 붙여 올린다.
      # docker pull ghcr.io/handsomeguen/blogville:<버전>으로 운영과 같은 이미지를 받아 띄워 볼 수 있다.
      # 실패해도 배포는 이미 끝났으므로 deploy를 빨갛게 만들지 않는다.
      - name: 이미지 저장소(GHCR)에 올리기
        if: github.repository == 'handsomeguen/blogville'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION=$(node -p "require('./package.json').version")
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${GITHUB_SHA::7}" "$VERSION" latest; do
            docker tag "$IMAGE" "$REPO:$tag"
            docker push -q "$REPO:$tag"
          done
          echo "### 이미지 저장소" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull $REPO:$VERSION (꼬리표: ${GITHUB_SHA::7}, $VERSION, latest)" >> "$GITHUB_STEP_SUMMARY"
