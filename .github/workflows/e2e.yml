# 화면 시험(Playwright E2E)을 실제 PostgreSQL과 운영 빌드(next start)로 돌린다.
# 운영으로 가는 PR(release·hotfix → main)마다, 그리고 `e2e` 꼬리표를 단 develop PR에서 돈다. 손으로는 Actions → e2e → Run workflow.
# 약 15~25분. 실패하면 화면 기록(Playwright 보고서)을 내려받을 수 있다.
name: e2e

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blogville
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blog" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 시험용 환경 변수
        run: |
          cat > .env.local <<ENV
          DATABASE_URL=postgres://blog:blog@localhost:5432/blogville
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          BETTER_AUTH_URL=http://localhost:3000
          UPLOAD_DIR=storage/uploads
          ENV

      - name: DB 준비
        run: |
          npm run db:migrate
          npm run db:seed

      - name: 빌드·서버 켜기
        run: |
          npm run build
          set -a; . ./.env.local; set +a
          nohup npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 2; done
          cat next.log; exit 1

      - name: 화면 시험
        run: npx playwright test --workers=3 --retries=1 --reporter=list,html

      - name: 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            next.log
          retention-days: 7
