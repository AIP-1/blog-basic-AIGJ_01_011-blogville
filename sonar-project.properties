# SonarQube(로컬, docker compose --profile sonar)와 SonarCloud(.github/workflows/sonar.yml)가 같이 읽는 분석 설정.
# 로컬: npm run test:coverage && SONAR_TOKEN=<로컬 토큰> npm run sonar
# SonarCloud의 organization은 워크플로가 -Dsonar.organization으로 넘긴다(로컬 SonarQube에는 없는 값이라 여기 두지 않음).
sonar.projectKey=handsomeguen_blogville
sonar.projectName=Blogville
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=**/*.css,**/*.svg,**/*.png
sonar.test.inclusions=tests/**/*

# 단위 테스트는 src/lib·src/server의 순수 함수만 시험한다. 화면(app·components)은 E2E가 맡으므로 커버리지 계산에서 뺀다.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/app/**,src/components/**,scripts/**,src/**/*.tsx

# 표 정의는 모양이 비슷한 줄이 많아 중복 검사에서 뺀다
sonar.cpd.exclusions=src/db/schema.ts
