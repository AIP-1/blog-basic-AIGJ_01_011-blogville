# API Gateway (MSA 실습, docker compose --profile msa). 바깥에서 들어오는 문은 이것 하나(8080)이고,
# 경로를 보고 뒤의 서비스로 나눠 보낸다. 서비스 주소는 IP가 아니라 이름(app-msa, market)으로 적고
# 도커 안 DNS(127.0.0.11)에 5초마다 다시 물어 찾는다(Service Discovery). market을 여러 벌 띄우면 돌아가며 보낸다.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format gateway '$remote_addr "$request" $status → $upstream_addr ($request_time s)';

server {
  listen 8080;
  access_log /dev/stdout gateway;
  add_header X-Gateway blogville-gateway always;

  # 게이트웨이 자신의 상태
  location = /gateway/health {
    default_type application/json;
    return 200 '{"status":"UP","service":"gateway"}';
  }

  # 시세·날씨 서비스는 상태 확인만 바깥에 연다 (바깥 API 대신 받기는 앱만 쓴다)
  location = /market/health {
    set $market http://market:8500;
    proxy_pass $market/health;
  }

  # 나머지는 블로그 앱으로
  location / {
    set $app http://app-msa:8400;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 증시 실시간(SSE)이 끊기지 않게
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 40m;
  }
}
