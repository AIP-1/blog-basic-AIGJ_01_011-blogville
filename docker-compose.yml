# 로컬 개발·실습용 도커 구성. 운영 서버의 블루·그린 구성은 deploy/compose.yml이다.
#
#   docker compose up -d db                 # PostgreSQL만 (npm run dev와 같이 쓸 때)
#   docker compose --profile app up --build # 운영과 같은 이미지(Dockerfile)로 앱까지 → http://localhost:8400
#   docker compose --profile sonar up -d    # SonarQube 품질 검사 서버 → http://localhost:9000 (docs/learning/03-sonar.md)
#   docker compose --profile msa up --build --scale market=2
#                                           # MSA 실습: 게이트웨이 → 앱 + 시세·날씨 서비스 두 벌 → http://localhost:8080
#
# 자세한 설명: docs/learning/04-docker.md
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blogville
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blogville"]
      interval: 2s
      timeout: 3s
      retries: 30

  app: &app
    profiles: [app]
    build: .
    image: blogville:local
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      # 컨테이너끼리는 서비스 이름(db)으로 찾아간다
      DATABASE_URL: postgres://blog:blog@db:5432/blogville
      BETTER_AUTH_URL: http://localhost:8400
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-docker-secret-change-me-0123456789}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8400:8400"
    volumes:
      - uploads:/app/storage/uploads

  # ── MSA 실습 (profile msa, docs/learning/09-msa.md) ──
  # 바깥 문은 gateway(8080) 하나. 앱은 포트를 열지 않고 게이트웨이 뒤에 숨는다.
  app-msa:
    <<: *app
    profiles: [msa]
    ports: []
    depends_on:
      db:
        condition: service_healthy
      market:
        condition: service_healthy
    environment:
      <<: *app-env
      BETTER_AUTH_URL: http://localhost:8080
      # 바깥 시세·날씨 API 대신 market 서비스로 (이름으로 찾아감). 앱 코드는 그대로다
      STOCK_QUOTE_BASE: http://market:8500/naver/polling
      STOCK_CHART_BASE: http://market:8500/naver/api
      STOCK_SEARCH_BASE: http://market:8500/naver/ac
      WEATHER_BASE: http://market:8500/open-meteo/api
      AIR_BASE: http://market:8500/open-meteo/air

  market:
    profiles: [msa]
    build: ./services/market
    image: blogville-market:local
    # 여러 벌 띄울 수 있게(--scale market=2) 포트를 바깥에 열지 않는다

  gateway:
    profiles: [msa]
    image: nginx:1.27-alpine
    depends_on:
      app-msa:
        condition: service_healthy  # 이미지의 HEALTHCHECK(/api/health)
      market:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  sonarqube:
    profiles: [sonar]
    image: sonarqube:community
    environment:
      # 실습용이라 디스크 검사(Elasticsearch bootstrap check)를 끈다
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

volumes:
  pgdata:
  uploads:
  sonar-data:
  sonar-extensions:
